fcr etwas Abwechslung?'}</b><p>${review?`${review} Lernfrage${review===1?'':'n'} wartet${review===1?'':'n'} auf eine Wiederholung.`:'Im Entdecker-Mix wechselst du zwischen Flaggen, St\u00e4dten und Regionen.'}</p></div><button class="text-btn" data-action="start-quiz" data-mode="${review?'review':'mix'}">${review?'Gezielt wiederholen':'Entdecker-Mix'} ${icon('arrow')}</button></div></div>`;}
function cityArt(){return`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="51" fill="#dde7cd"/><path d="M13 101h94" stroke="#789882" stroke-width="3" stroke-linecap="round"/><path d="M29 100V53h21v47M71 100V40h18v60M53 100V26h15v74" fill="#f8f2da" stroke="#739582" stroke-width="2"/><path d="m51 26 9-17 10 17Z" fill="#d7845e"/><path d="M60 9V3m15 37 6-12 6 12" stroke="#739582" stroke-width="2" fill="none"/><path d="M36 62h7m-7 11h7m-7 11h7m33-34h6m-6 12h6m-6 12h6m-6 12h6M59 38h4m-4 12h4m-4 12h4m-4 12h4" stroke="#749887" stroke-width="3"/><path d="M55 100V85h10v15" fill="#719782"/></svg>`;}
function globeArt(){return`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="53" r="40" fill="#b5d6d0"/><path d="M29 35 42 20l19-7 17 6-6 16-18 8-4 19-13 2-3-13-8-6Zm31 18 22 5 6 13-15 11-7 10-10-9-5-21Z" fill="#68947c"/><circle cx="60" cy="53" r="40" fill="none" stroke="#597d76" stroke-width="2"/><path d="M92 10a55 55 0 0 1-62 90m30 8v8m-17 0h34" fill="none" stroke="#6a8c7e" stroke-width="4" stroke-linecap="round"/><path d="m87 7 10 8M26 96l11 8" stroke="#cf925e" stroke-width="5" stroke-linecap="round"/><path d="M22 52h76" stroke="#e1f1df" stroke-opacity=".6" fill="none"/></svg>`;}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function rankNeed(c,mode){const d=getCountryProgress(c.id);return (mode==='flag'?2-d.flag:mode==='capital'?1-Number(d.capital):mode==='continent'?1-Number(d.continent):500-countryKm(c.id))*4+(progress.review[c.id+':'+mode]?7:0)+Math.random()*4;}
function startQuiz(mode='flag',specific=null){
 if(['quiz','memory'].includes(state.view)&&state.game&&!state.game.finished){if(!confirm('Neue Runde starten? Gesammelte Lern-km bleiben erhalten.'))return;}
 clearTimeout(memoryTimer);stopSpeech();closeModal(false);
 let questions=[];
 if(!specific&&mode==='flag'&&state.gameRegion==='starter'&&STARTERS.every(id=>getCountryProgress(id).flag===2)){state.gameRegion='all';showToast('Die ersten 20 Flaggen sitzen. Jetzt warten alle 80 L\u00e4nder auf dich!');}
 if(mode==='review'){
  const keys=shuffle(Object.keys(progress.review)).slice(0,8);
  questions=keys.map(k=>{const[id,m]=k.split(':');return makeQuestion(BY_ID[id],m);});
  if(!questions.length){mode='mix';}
 }
 if(!questions.length){let pool=specific?[BY_ID[specific]]:gamePool();pool=pool.map(c=>({c,score:rankNeed(c,mode)})).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.c);questions=pool.map((c,i)=>makeQuestion(c,mode==='mix'?['flag','capital','continent'][i%3]:mode));}
 state.game={kind:'quiz',mode,questions,index:0,locked:false,selected:null,correct:0,earned:0,answers:[],delta:0,finished:false};state.view='quiz';render();$('#main').scrollTop=0;
}
function makeQuestion(c,mode){
 const n=progress.settings.difficulty==='starter'?3:4;let prompt,correct,options,explanation;
 if(mode==='flag'){
  prompt='Zu welchem Land geh\u00f6rt diese Flagge?';correct=c.name;explanation=`Das ist die Flagge von ${c.name}.`;
  const others=COUNTRIES.filter(x=>x.id!==c.id);const same=shuffle(others.filter(x=>x.region===c.region));const mixed=shuffle(others.filter(x=>x.region!==c.region));const distractors=progress.settings.difficulty==='explorer'?[...same,...mixed]:shuffle(others);options=shuffle([correct,...distractors.slice(0,n-1).map(x=>x.name)]);
 }else if(mode==='capital'){
  prompt=c.id==='ch'?'Wie heisst die Bundesstadt der Schweiz?':c.id==='za'?'Wie heisst die Verwaltungshauptstadt von S\u00fcdafrika?':c.id==='lk'?'Wie heisst die Parlamentshauptstadt von Sri Lanka?':`Wie heisst die Hauptstadt von ${c.name}?`;
  correct=c.capital;explanation=c.id==='ch'?'Bern ist die Bundesstadt der Schweiz.':c.id==='za'?'Pretoria ist die Verwaltungshauptstadt.':c.id==='lk'?'Sri Jayewardenepura Kotte ist die Parlamentshauptstadt.':`${c.capital} ist die Hauptstadt von ${c.name}.`;
  const others=[...new Set(COUNTRIES.filter(x=>x.id!==c.id).map(x=>x.capital))].filter(x=>x!==correct);options=shuffle([correct,...shuffle(others).slice(0,n-1)]);
 }else{
  mode='continent';correct=REGIONS[c.region];prompt=['kz','eg'].includes(c.id)?`Wo liegt der gr\u00f6sste Teil von ${c.name}?`:`In welcher Weltregion liegt ${c.name}?`;explanation=['kz','eg'].includes(c.id)?c.note:c.region==='OC'?`${c.name} geh\u00f6rt zur Weltregion Ozeanien.`:`${placePhrase(c)} ${['us','nl','ph','ae'].includes(c.id)?'liegen':'liegt'} in ${REGIONS[c.region]}.`;options=shuffle([correct,...shuffle(Object.values(REGIONS).filter(x=>x!==correct)).slice(0,n-1)]);
 }
 return {country:c,mode,prompt,correct,options,explanation};
}
function renderQuiz(){const g=state.game;if(!g||g.kind!=='quiz')return renderGames();const q=g.questions[g.index];const success=g.selected===q.correct;
 const content=q.mode==='flag'?`<div class="question-flag">${flagImg(q.country,'',true)}</div><h2>${esc(q.prompt)}</h2>`:q.mode==='capital'?`<div class="question-mini-flag">${flagImg(q.country)}</div><h2>${esc(q.prompt)}</h2>`:`<div class="question-map">${worldSvg({focus:q.country.id})}</div><h2>${esc(q.prompt)}</h2>`;
 return`<div class="play-screen"><div class="play-head"><div><h1>${MODES[g.mode]}</h1><p class="tiny">Frage ${g.index+1} von ${g.questions.length} \u00b7 In deinem Tempo</p></div><div class="round-progress" aria-label="Frage ${g.index+1} von ${g.questions.length}">${g.questions.map((_,i)=>`<i class="${i<g.index?(g.answers[i]?.correct?'done':'wrong'):i===g.index?'now':''}"></i>`).join('')}</div><button class="btn secondary small" data-action="nav" data-view="games">${icon('close')}Runde verlassen</button></div><div class="play-grid"><section class="question-card"><div class="kicker">${q.mode==='flag'?'Genau hinschauen':q.mode==='capital'?'St\u00e4dte entdecken':'Einmal um die Welt'}</div>${content}</section><section class="answer-panel"><p class="answer-intro">Tippe auf deine Antwort.</p><div class="answers ${q.options.length===3?'three':''}">${q.options.map((o,i)=>`<button class="answer ${g.locked?(o===q.correct?'correct':o===g.selected?'wrong':''):''}" data-action="answer" data-index="${i}" ${g.locked?'disabled':''}><span class="answer-key" aria-hidden="true">${g.locked&&o===q.correct?'\u2713':g.locked&&o===g.selected?'\u00d7':String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="feedback-area ${g.locked?(success?'good':'bad'):''}" aria-live="polite"><div class="feedback-message">${g.locked?`<strong>${success?'Richtig erkannt!':'Fast. Schau noch einmal hin.'}</strong><p>${success?(g.delta?`+${g.delta} Lern-km f\u00fcr deinen Ballon.`:'Wissen gefestigt. Diese Lernstation ist schon geschafft.'):esc(q.explanation)}</p>`:'<p>Du kannst dir die Frage auch vorlesen lassen.</p>'}</div>${g.locked?`<button class="btn ${success?'':'secondary'}" data-action="next-question">${g.index===g.questions.length-1?'Auswertung':'Weiter'}${icon('arrow')}</button>`:''}</div></section></div><div class="play-foot"><span>${g.correct} richtig \u00b7 +${g.earned} Lern-km in dieser Runde</span><span class="keyboard-note">Tastatur: 1\u20134 oder A\u2013D \u00b7 Enter = weiter</span></div></div>`;
}
function answerQuestion(index){const g=state.game;if(state.view!=='quiz'||!g||g.locked)return;const q=g.questions[g.index];const answer=q.options[index];if(!answer)return;stopSpeech();g.locked=true;g.selected=answer;progress.stats.answers++;const correct=answer===q.correct;g.delta=0;
 if(correct){g.correct++;progress.stats.correct++;delete progress.review[q.country.id+':'+q.mode];g.delta=award(q.country.id,q.mode);g.earned+=g.delta;}else{progress.review[q.country.id+':'+q.mode]=true;save();}
 g.answers.push({country:q.country.id,mode:q.mode,correct});playTone(correct);render();const next=$('[data-action="next-question"]');if(next)next.focus({preventScroll:true});
}
function nextQuestion(){const g=state.game;if(!g||!g.locked)return;stopSpeech();if(g.index>=g.questions.length-1){g.finished=true;progress.stats.rounds++;save();state.lastResult={kind:'quiz',mode:g.mode,correct:g.correct,total:g.questions.length,earned:g.earned,countries:g.answers.map(a=>a.country),mistakes:g.answers.filter(a=>!a.correct).length};state.view='result';render();return;}g.index++;g.locked=false;g.selected=null;g.delta=0;render();$('#main').focus({preventScroll:true});}
function memorySetup(){state.modal={kind:'memory'};showModal(`<div class="modal-head"><h2>Dein Flaggen-Memory</h2><button class="tool" data-action="close-modal" aria-label="Schliessen">${icon('close')}</button></div><p class="muted tiny">${gamePool().length<12?'Kleine L\u00e4nderauswahl? Das Kartenset wird automatisch passend erg\u00e4nzt.':'W\u00e4hle die Gr\u00f6sse deiner Runde.'}</p><div class="memory-setup">${[6,8,12].map(n=>`<button class="${state.memorySize===n?'active':''}" data-action="memory-size" data-size="${n}"><b>${n}</b><small>Paare \u00b7 ${n*2} Karten</small></button>`).join('')}</div><div class="settings-row"><div><b>Was passt zusammen?</b><p class="tiny">Leicht: gleiche Flaggen. Kniffliger: Flagge und Name.</p></div></div><div class="segmented" style="margin:12px 0 22px"><button class="${state.memoryVariant==='flags'?'active':''}" data-action="memory-variant" data-value="flags">Flagge + Flagge</button><button class="${state.memoryVariant==='names'?'active':''}" data-action="memory-variant" data-value="names">Flagge + Name</button></div><button class="btn" data-action="start-memory">Karten mischen ${icon('arrow')}</button>`,'options-modal');}
function startMemory(){if(['quiz','memory'].includes(state.view)&&state.game&&!state.game.finished&&!confirm('Neue Runde starten? Bisherige Lern-km bleiben erhalten.'))return;clearTimeout(memoryTimer);stopSpeech();closeModal(false);let pool=shuffle(gamePool());if(pool.length<state.memorySize){pool=[...pool,...shuffle(COUNTRIES.filter(c=>!pool.includes(c)))];}pool=pool.slice(0,state.memorySize);const cards=shuffle(pool.flatMap(c=>[{id:c.id,kind:'flag'},{id:c.id,kind:state.memoryVariant==='names'?'name':'flag'}]));state.game={kind:'memory',cards,open:[],matched:[],moves:0,pairs:pool.length,earned:0,locked:false,finished:false,variant:state.memoryVariant,message:'Decke zwei Karten auf. Welche passen zusammen?'};state.view='memory';render();$('#main').scrollTop=0;}
function renderMemory(){const g=state.game;if(!g||g.kind!=='memory')return renderGames();return`<div class="memory-screen"><div class="play-head"><div><h1>Flaggen-Memory</h1><p class="tiny">${g.variant==='names'?'Flagge + L\u00e4ndername':'Gleiche Flaggen finden'} \u00b7 ${g.pairs} Paare</p></div><div class="round-progress" aria-label="${g.matched.length} von ${g.pairs} Paaren gefunden">${Array.from({length:g.pairs},(_,i)=>`<i class="${i<g.matched.length?'done':''}"></i>`).join('')}</div><button class="btn secondary small" data-action="nav" data-view="games">${icon('close')}Runde verlassen</button></div><div class="memory-board size${g.pairs}" aria-label="Memorykarten">${g.cards.map((card,i)=>{const matched=g.matched.includes(card.id),open=matched||g.open.includes(i),c=BY_ID[card.id];return`<button class="mem-card ${open?'open':''} ${matched?'matched':''}" data-action="flip" data-index="${i}" aria-label="${matched?'Gefunden: '+esc(c.name):open?(card.kind==='name'?esc(c.name):'Aufgedeckte Flagge'):'Verdeckte Karte '+(i+1)}" ${matched?'disabled':''}><span class="mem-inner"><span class="mem-back" aria-hidden="true">${icon('balloon')}<b>Weltreise</b></span><span class="mem-front" aria-hidden="${!open}">${open?(card.kind==='name'?`<span>${esc(c.name)}</span>`:`${flagImg(c,'',!matched)}${matched?`<small>${esc(c.name)}</small>`:''}`):''}</span></span></button>`;}).join('')}</div><div class="memory-bottom"><span class="memory-message" aria-live="polite">${esc(g.message)}</span><span class="tiny muted">${g.matched.length} / ${g.pairs} Paare \u00b7 ${g.moves} Z\u00fcge \u00b7 +${g.earned} km</span></div></div>`;}
function flipCard(i){const g=state.game;if(state.view!=='memory'||!g||g.locked||g.open.includes(i)||!g.cards[i]||g.matched.includes(g.cards[i].id))return;g.open.push(i);if(g.open.length<2){render();return;}g.moves++;g.locked=true;const[a,b]=g.open.map(j=>g.cards[j]);if(a.id===b.id){g.matched.push(a.id);const delta=award(a.id,'memory');g.earned+=delta;g.message=`${BY_ID[a.id].name}: Paar gefunden.${delta?' +50 Lern-km!':' Gut gemerkt!'}`;playTone(true);g.open=[];g.locked=false;render();if(g.matched.length===g.pairs){g.locked=true;memoryTimer=setTimeout(()=>{if(state.game!==g||state.view!=='memory')return;g.finished=true;progress.stats.memoryRounds++;save();state.lastResult={kind:'memory',mode:'memory',correct:g.matched.length,total:g.pairs,earned:g.earned,countries:[...g.matched],moves:g.moves};state.view='result';render();},850);}}else{g.message='Noch kein Paar. Merke dir die beiden Karten.';render();memoryTimer=setTimeout(()=>{if(state.game!==g||state.view!=='memory')return;g.open=[];g.locked=false;g.message='Versuche ein anderes Kartenpaar.';render();},1050);}}
function renderResult(){const r=state.lastResult;if(!r)return renderHome();const done=totalKm()===TOTAL_KM;const title=done?'Einmal um die Welt!':r.kind==='memory'?'Alle Paare gefunden!':r.correct===r.total?'Grossartige Reise!':r.correct>=r.total/2?'Gut geflogen!':'Wieder etwas entdeckt!';const desc=r.kind==='memory'?'Jedes gefundene Flaggenpaar hilft dir beim Merken. F\u00fcr ein neues L\u00e4nderpaar gibt es einmalig 50 Lern-km.':r.correct===r.total?'Du hast jede Frage richtig beantwortet. Dein Ballon ist bereit f\u00fcr das n\u00e4chste Abenteuer.':'Fehler geh\u00f6ren zum Lernen. Die kniffligen Fragen liegen zum Wiederholen f\u00fcr dich bereit.';
 return`<div class="results"><div class="result-hero"><div class="finish-mark">${icon('check')}</div>${balloonSvg(progress.settings.balloon,'result-balloon')}<div class="result-km">+${fmt(r.earned)} km</div><p>Lern-km in dieser Runde</p>${r.earned>0?`<div class="confetti" aria-hidden="true">${Array.from({length:14},(_,i)=>`<i style="left:${(i*37)%100}%;background:${['#dc9e5b','#588a75','#9dbdbc','#e9c880'][i%4]};animation-delay:${(i%5)*.17}s"></i>`).join('')}</div>`:''}</div><div class="result-content"><div class="kicker">Deine Reise geht weiter</div><h1>${title}</h1><p>${desc}</p><div class="result-statline"><div><strong>${r.kind==='memory'?r.moves:r.correct+' / '+r.total}</strong><small>${r.kind==='memory'?'Z\u00fcge':'richtig beantwortet'}</small></div><div><strong>${fmt(totalKm())} km</strong><small>auf deiner Weltreise</small></div><div><strong>${counts().seen} / 80</strong><small>L\u00e4nder kennengelernt</small></div></div><div class="result-countries" aria-label="L\u00e4nder dieser Runde">${[...new Set(r.countries)].map(id=>flagImg(BY_ID[id])).join('')}</div><div class="row" style="flex-wrap:wrap"><button class="btn warm" data-action="${r.kind==='memory'?'start-memory':'start-quiz'}" data-mode="${r.mode}">Noch eine Runde ${icon('arrow')}</button><button class="btn secondary" data-action="nav" data-view="passport">Mein Reisepass</button>${r.mistakes?'<button class="text-btn" data-action="start-quiz" data-mode="review">Kniffliges wiederholen</button>':''}</div></div></div>`;
}
function renderPassport(){const c=counts(),km=totalKm();return`<div class="page-head"><div><h1>Dein Reisepass</h1><p>Jede Flagge erz\u00e4hlt von etwas, das du gelernt hast.</p></div><button class="btn secondary small" data-action="nav" data-view="home">${icon('back')}Zur Reise</button></div><div class="passport-overview"><div class="passport-ticket">${balloonSvg(progress.settings.balloon,'ticket-art')}<div class="ticket-text"><div class="kicker">${level()}</div><h2>${fmt(km)} Lern-km</h2><p>Dein Ziel: 40\u2019000 Lern-km um die Welt</p><div class="progress"><span style="width:${km/400}%"></span></div></div></div><div class="passport-stats"><div class="passport-stat"><b>${c.seen}</b><small>L\u00e4nder<br>kennengelernt</small></div><div class="passport-stat"><b>${c.flags}</b><small>Flaggen zweimal<br>richtig erkannt</small></div><div class="passport-stat"><b>${c.mastered}</b><small>L\u00e4nder mit allen<br>Lernstationen</small></div></div></div><div class="passport-tabs"><div class="segmented"><button class="${state.passportTab==='stamps'?'active':''}" data-action="passport-tab" data-value="stamps">Meine L\u00e4nder</button><button class="${state.passportTab==='balloons'?'active':''}" data-action="passport-tab" data-value="balloons">Mein Ballon</button><button class="${state.passportTab==='skills'?'active':''}" data-action="passport-tab" data-value="skills">Lernstationen</button></div><span class="passport-note">${state.passportTab==='balloons'?'Neue Farben werden unterwegs freigeschaltet.':'500 Lern-km pro Land \u00b7 80 L\u00e4nder = 40\u2019000 km'}</span></div>${state.passportTab==='balloons'?renderBalloons():state.passportTab==='skills'?renderSkills():`<div class="country-grid">${[...COUNTRIES].sort((a,b)=>Number(countryKm(b.id)>0)-Number(countryKm(a.id)>0)||byName(a,b)).map(c=>countryCard(c,true)).join('')}</div>`}`;}
function renderBalloons(){const k=totalKm();return`<div class="balloon-grid">${Object.entries(PALETTES).map(([key,p])=>`<article class="hangar-card ${k<p.km?'locked':''}">${balloonSvg(key)}<h3>${p.name}</h3><p>${p.km?`Ab ${fmt(p.km)} Lern-km`:'Von Anfang an dabei'}</p><button class="btn ${key===progress.settings.balloon?'subtle':'secondary'} small" data-action="balloon" data-value="${key}" ${k<p.km?'disabled':''}>${key===progress.settings.balloon?'Dein Ballon':k<p.km?'Noch '+fmt(p.km-k)+' km':'Diesen Ballon fliegen'}</button></article>`).join('')}</div>`;}
function renderSkills(){return`<div class="skills">${[...COUNTRIES].sort(byName).map(c=>{const p=getCountryProgress(c.id);return`<div class="skill-country">${flagImg(c)}<span class="skill-name">${esc(c.name)}</span><div class="skill-markers">${[[p.discovered,'Entdeckt 50'],[p.flag>=1,'Flagge 100'],[p.flag>=2,'Gefestigt 100'],[p.capital,'Hauptstadt 100'],[p.continent,'Region 100'],[p.memory,'Memory 50']].map(([b,t])=>`<span class="skill-marker ${b?'done':''}">${b?'\u2713 ':''}${t}</span>`).join('')}</div><span class="tiny">${countryKm(c.id)} / 500</span></div>`;}).join('')}</div>`;}
function showModal(content,extra=''){const d=$('#modal');d.className='modal '+extra;d.innerHTML='<div class="modal-inner">'+content+'</div>';if(!d.open)d.showModal();}
function closeModal(restore=true){const d=$('#modal'),scroll=$('#main').scrollTop,wasOpen=d.open;if(wasOpen)d.close();if(state.modal)stopSpeech();state.modal=null;if(restore&&wasOpen){render();$('#main').scrollTop=scroll;}}
function openCountry(id,list=null){if(!BY_ID[id])return;stopSpeech();const supplied=list||((state.view==='atlas')?filteredCountries().map(c=>c.id):[...COUNTRIES].sort(byName).map(c=>c.id));state.modal={kind:'country',id,list:supplied.includes(id)?supplied:COUNTRIES.map(c=>c.id)};renderCountryModal();}
function countryNoteSource(c){return c.id==='ch'?'https://www.eda.admin.ch/aboutswitzerland/en/home/politik-geschichte/politisches-system.html':c.id==='za'?'https://www.gov.za/about-sa/south-africas-provinces':c.id==='lk'?'https://www.gov.lk/sri-lanka/country-overview':c.id==='nl'?'https://www.geonames.org/countries/NL/netherlands.html':'https://www.geonames.org/countries/';}
function placePhrase(c){return ({ch:'Die Schweiz',us:'Die USA',gb:'Das Vereinigte K\u00f6nigreich',nl:'Die Niederlande',ph:'Die Philippinen',ae:'Die Vereinigten Arabischen Emirate'})[c.id]||c.name;}
function renderCountryModal(){const m=state.modal;if(!m||m.kind!=='country')return;const c=BY_ID[m.id],p=getCountryProgress(c.id),i=m.list.indexOf(c.id);const capLabel=c.id==='ch'?'Bundesstadt':c.id==='za'?'Verwaltungshauptstadt':c.id==='lk'?'Parlamentshauptstadt':'Hauptstadt';
 showModal(`<div class="modal-head"><h2>Dein L\u00e4nderatlas</h2><button class="tool" data-action="close-modal" aria-label="L\u00e4nderprofil schliessen">${icon('close')}</button></div><div class="country-detail"><div class="detail-visual"><div class="detail-flag">${flagImg(c)}</div><div class="detail-map">${worldSvg({focus:c.id,small:true})}<span>Vereinfachte Lage \u00b7 Natural Earth</span></div></div><div class="detail-copy"><h1>${esc(c.name)}</h1><div class="detail-facts"><div class="detail-fact"><small>${capLabel}</small><b>${esc(c.capital)}</b></div><div class="detail-fact"><small>Weltregion</small><b>${REGIONS[c.region]}</b></div></div><div class="detail-tip"><b>So merkst du dir die Flagge</b><p>${esc(c.tip)}</p></div><p class="detail-note">${esc(c.note||`${placePhrase(c)} ${['us','nl','ph','ae'].includes(c.id)?'liegen':'liegt'} in ${REGIONS[c.region]}. Finde das Land auf der Karte. Schliesse dann kurz die Augen: Welche Farben und Formen hat seine Flagge?`)} <a href="${countryNoteSource(c)}" target="_blank" rel="noopener">Grunddaten</a></p><div class="detail-actions"><button class="btn ${p.discovered?'subtle':'warm'}" data-action="discover" data-id="${c.id}" ${p.discovered?'disabled':''}>${p.discovered?icon('check')+'Land entdeckt':'Land entdecken \u00b7 +50 km'}</button><button class="btn secondary" data-action="country-speak">${icon(state.speaking?'stop':'speaker')}Vorlesen</button><button class="text-btn" data-action="country-quiz" data-id="${c.id}">Flagge \u00fcben ${icon('arrow')}</button></div></div></div><div class="detail-footer"><span class="tiny">${countryKm(c.id)} / 500 Lern-km \u00b7 Land ${i+1} von ${m.list.length}</span><div class="detail-nav"><button class="btn secondary small" data-action="country-step" data-step="-1" aria-label="Vorheriges Land">${icon('back')}Zur\u00fcck</button><button class="btn secondary small" data-action="country-step" data-step="1" aria-label="N\u00e4chstes Land">Weiter ${icon('arrow')}</button></div></div>`);
}
function stepCountry(step){const m=state.modal;if(!m||m.kind!=='country')return;const i=m.list.indexOf(m.id),id=m.list[(i+step+m.list.length)%m.list.length];stopSpeech();m.id=id;renderCountryModal();}
function openSettings(){state.modal={kind:'settings'};renderSettings();}
function renderSettings(){showModal(`<div class="modal-head"><h2>Dein Reiseb\u00fcro</h2><button class="tool" data-action="close-modal" aria-label="Einstellungen schliessen">${icon('close')}</button></div><section class="settings-section"><h3>So lernst du am liebsten</h3><div class="settings-row"><div><b>Antworten im Quiz</b><p>Die L\u00e4nderauswahl stellst du unter Spiele ein.</p></div><div class="segmented"><button class="${progress.settings.difficulty==='starter'?'active':''}" data-action="difficulty" data-value="starter">Leicht<br>3 Antworten</button><button class="${progress.settings.difficulty==='explorer'?'active':''}" data-action="difficulty" data-value="explorer">Entdecker<br>4 Antworten</button></div></div><div class="settings-row"><div><b>Dezente Spielt\u00f6ne</b><p>Vorlesen bleibt unabh\u00e4ngig davon verf\u00fcgbar.</p></div><button class="toggle ${progress.settings.sound?'on':''}" data-action="toggle-sound" aria-pressed="${progress.settings.sound}">${progress.settings.sound?'Ton an':'Ton aus'}</button></div></section><section class="settings-section"><h3>Dein Lernstand bleibt bei dir</h3><p>Kein Konto, keine Werbung, kein Tracking. Der Lernstand liegt in diesem Browser auf diesem Ger\u00e4t. Auf einem anderen Ger\u00e4t oder nach dem L\u00f6schen der Browserdaten ist er nicht automatisch vorhanden.</p>${!storageOK?'<p style="color:var(--bad);margin-top:8px">Die Speicherung ist momentan nicht verf\u00fcgbar. Exportiere deinen Lernstand, bevor du die App schliesst.</p>':''}<div class="backup-actions"><button class="btn secondary small" data-action="export">${icon('download')}Lernstand sichern</button><button class="btn secondary small" data-action="import">Lernstand einlesen</button></div></section><section class="settings-section"><h3>Eine faire Weltreise</h3><p>80 L\u00e4nder mit je 500 Lern-km ergeben 40\u2019000 Lern-km. Bereits geschaffte Stationen schenken keine weiteren Kilometer. \u00dcben lohnt sich trotzdem.</p><button class="text-btn" data-action="info">Regeln, Inhalte und Quellen ${icon('arrow')}</button></section><details class="danger-zone"><summary>F\u00fcr Erwachsene: Reise zur\u00fccksetzen</summary><p>Das l\u00f6scht den Lernstand auf diesem Ger\u00e4t. Sichere ihn vorher. Tippe NEUSTART zur Best\u00e4tigung.</p><input id="resetConfirm" autocomplete="off" placeholder="NEUSTART" aria-label="NEUSTART zur Best\u00e4tigung"><button class="btn secondary small" data-action="reset">Lernstand l\u00f6schen</button></details>`,'options-modal');}
function openInfo(){state.modal={kind:'info'};showModal(`<div class="modal-head"><h2>So funktioniert deine Weltreise</h2><button class="tool" data-action="close-modal" aria-label="Information schliessen">${icon('close')}</button></div><h3>80 Flaggen. 40\u2019000 Lern-km.</h3><p>Der Ballon folgt einer spielerischen Reise von Bern einmal um die Welt. Die Kilometer messen Lernfortschritt, nicht echte Entfernungen zwischen L\u00e4ndern. Die Reisestationen liegen alle 4\u2019000 Lern-km.</p><ul class="rules-list"><li>Ein Land im Atlas bewusst entdecken: einmalig <b>50 km</b>.</li><li>Seine Flagge richtig erkennen: <b>100 km</b>. Ein zweites Mal: nochmals <b>100 km</b>.</li><li>Die Hauptstadt richtig zuordnen: einmalig <b>100 km</b>.</li><li>Die Weltregion richtig zuordnen: einmalig <b>100 km</b>.</li><li>Das erste Memorypaar dieses Landes finden: einmalig <b>50 km</b>.</li></ul><p>Das sind maximal <b>500 Lern-km pro Land</b>. Falsche Antworten kosten keine Kilometer. Sie werden zum Wiederholen vorgemerkt. Ein bereits gefestigtes Land bleibt frei spielbar, ohne den Fortschritt k\u00fcnstlich zu erh\u00f6hen.</p><h3>Kontinente &amp; Weltregionen</h3><p>Die App gruppiert ihre 80 L\u00e4nder in Europa, Asien, Afrika, Nordamerika, S\u00fcdamerika und Ozeanien. Ozeanien umfasst hier Australien und die pazifischen Inselstaaten. Die Antarktis ist ebenfalls ein Kontinent, hat aber keine Staaten f\u00fcr dieses L\u00e4nderquiz. Bei \u00c4gypten und Kasachstan fragen wir ausdr\u00fccklich nach dem gr\u00f6ssten Teil des Landes.</p><h3>Besondere Hauptst\u00e4dte</h3><p>Bern wird als Bundesstadt bezeichnet. Bei S\u00fcdafrika fragt das Quiz nach der Verwaltungshauptstadt Pretoria; Kapstadt und Bloemfontein werden im Atlas erkl\u00e4rt. Bei Sri Lanka ist die Parlamentshauptstadt gemeint. Amsterdam und Den Haag werden unterschieden.</p><h3>Quellen und Technik</h3><p>Die Landkarte ist eine vereinfachte Natural-Earth-\u00dcbersicht in Robinson-Projektion, kein aktuelles politisches Grenzverzeichnis. Sehr kleine L\u00e4nder sind zus\u00e4tzlich markiert. Die Darstellung trifft keine Aussage zu Grenzstreitigkeiten. Die Flaggen sind eingebettete Bildabbildungen, keine vom Ger\u00e4t abh\u00e4ngigen Schriftzeichen.</p><div class="source-list"><a href="https://www.naturalearthdata.com/about/terms-of-use/" target="_blank" rel="noopener">Natural Earth \u2013 Kartengrundlage, Public Domain</a><a href="https://www.geonames.org/countries/" target="_blank" rel="noopener">GeoNames \u2013 L\u00e4nder und Hauptst\u00e4dte, CC BY 4.0</a><a href="https://github.com/googlefonts/noto-emoji" target="_blank" rel="noopener">Noto Emoji / Google \u2013 gerenderte Flaggenabbildungen</a><a href="https://www.eda.admin.ch/aboutswitzerland/en/home/politik-geschichte/politisches-system.html" target="_blank" rel="noopener">EDA \u2013 Bern als Bundesstadt</a><a href="https://www.gov.za/about-sa/south-africas-provinces" target="_blank" rel="noopener">S\u00fcdafrikanische Regierung \u2013 drei Hauptst\u00e4dte</a></div><h3>Speicherung &amp; Vorlesen</h3><p>Spielstand und Einstellungen werden lokal gespeichert. Ein Export l\u00e4sst sich auf einem anderen Ger\u00e4t wieder einlesen. Vorlesen verwendet die Stimmen des Browsers bzw. Betriebssystems; Sprachverf\u00fcgbarkeit und Offlinebetrieb h\u00e4ngen vom Ger\u00e4t ab. Die App bevorzugt eine lokale deutsche Stimme. Externe Quellen \u00f6ffnen sich nur, wenn du ihre Links antippst.</p><p style="margin-top:14px;font-size:10px">Version ${VERSION} \u00b7 Stand 26. September 2026 \u00b7 Eigenst\u00e4ndige Lern-App ohne Konto und ohne App-Bibliotheken.</p>`,'help-modal');}
function narration(){if(state.modal?.kind==='country'){const c=BY_ID[state.modal.id];return`${c.name}. ${c.id==='ch'?'Die Bundesstadt':c.id==='za'?'Die Verwaltungshauptstadt':c.id==='lk'?'Die Parlamentshauptstadt':'Die Hauptstadt'} heisst ${c.capital}. Die Weltregion ist ${REGIONS[c.region]}. So merkst du dir die Flagge: ${c.tip} ${c.note}`;}if(state.view==='quiz'){const g=state.game,q=g.questions[g.index];return g.locked?`${g.selected===q.correct?'Richtig!':'Noch nicht ganz.'} ${q.explanation} ${g.delta?'Du erh\u00e4ltst '+g.delta+' Lernkilometer.':''}`:`${q.prompt} ${q.options.map((o,i)=>'Antwort '+String.fromCharCode(65+i)+': '+o).join('. ')}`;}if(state.view==='memory')return state.game.message;if(state.view==='passport')return`Dein Reisepass. ${fmt(totalKm())} Lernkilometer. ${counts().seen} L\u00e4nder kennengelernt und ${counts().flags} Flaggen zweimal richtig erkannt.`;if(state.view==='result')return`Gut gemacht. Du hast ${state.lastResult.earned} Lernkilometer gesammelt.`;return'Willkommen bei In achtzig Flaggen um die Welt. Erkenne Flaggen, entdecke L\u00e4nder und fliege mit deinem Ballon um die Welt. Starte eine Reise oder entdecke ein Land im Atlas.';}
function speak(){if(state.speaking){stopSpeech();return;}if(!('speechSynthesis'in window)){showToast('Dieser Browser bietet keine Vorlesefunktion.');return;}try{speechSynthesis.cancel();utterance=new SpeechSynthesisUtterance(narration());const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/^de-CH/i.test(v.lang)&&v.localService)||voices.find(v=>/^de/i.test(v.lang)&&v.localService)||voices.find(v=>/^de/i.test(v.lang));if(voice)utterance.voice=voice;utterance.lang=voice?.lang||'de-DE';utterance.rate=.9;utterance.pitch=1;utterance.onend=()=>{state.speaking=false;updateSpeechButton();};utterance.onerror=()=>{state.speaking=false;updateSpeechButton();showToast('Vorlesen ist auf diesem Ger\u00e4t momentan nicht verf\u00fcgbar.');};state.speaking=true;updateSpeechButton();speechSynthesis.speak(utterance);}catch(e){state.speaking=false;updateSpeechButton();showToast('Vorlesen konnte nicht gestartet werden.');}}
function exportProgress(){const blob=new Blob([JSON.stringify({...progress,app:'In 80 Flaggen um die Welt',exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='80-Flaggen_Lernstand_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);showToast('Dein Lernstand wird als JSON-Datei gesichert.');}
async function importProgress(file){if(!file)return;if(file.size>1000000){showToast('Diese Datei ist zu gross. Bitte einen Lernstand-Export verwenden.');return;}try{const parsed=normalizeProgress(JSON.parse(await file.text()));if(!confirm(`Lernstand mit ${fmt(totalKm(parsed))} km einlesen? Der aktuelle Stand wird ersetzt.`))return;clearTimeout(memoryTimer);progress=parsed;state.game=null;state.lastResult=null;state.view='home';stopSpeech();closeModal(false);save();render();showToast('Lernstand erfolgreich eingelesen.');}catch(e){showToast('Diese Datei ist kein g\u00fcltiger V2-Lernstand. Nichts wurde ge\u00e4ndert.');}}
async function fullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen){await document.exitFullscreen();return;}if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();return;}showToast('Auf dem iPhone: Safari > Teilen > Zum Home-Bildschirm.');}catch(e){showToast('Vollbild wird hier nicht unterst\u00fctzt. Nutze das Querformat.');}}
function handleAction(e){const target=e.target.closest('[data-action]');if(!target||target.disabled)return;if(ignoreMapClick&&target.dataset.action==='country')return;const a=target.dataset.action,v=target.dataset.value;
 switch(a){
 case'nav':setView(target.dataset.view);break;
 case'speak':case'country-speak':speak();break;
 case'fullscreen':fullscreen();break;
 case'settings':openSettings();break;
 case'info':openInfo();break;
 case'close-modal':closeModal();break;
 case'country':openCountry(target.dataset.id);break;
 case'country-step':stepCountry(Number(target.dataset.step));break;
 case'discover':{const id=target.dataset.id;if(getCountryProgress(id).discovered)return;const delta=award(id,'discovered');renderCountryModal();if(delta){showToast(`Land entdeckt. +${delta} Lern-km!`);playTone(true);}break;}
 case'country-quiz':startQuiz('flag',target.dataset.id);break;
 case'atlas-display':state.atlasDisplay=v;state.mapZoom=1;state.mapPan={x:0,y:0};render();break;
 case'atlas-filter':state.atlasRegion=v;render();break;
 case'zoom':{const step=Number(target.dataset.step);state.mapZoom=step===0?1:clamp(state.mapZoom+step,1,5);if(step===0)state.mapPan={x:0,y:0};updateAtlasResults();break;}
 case'start-quiz':startQuiz(target.dataset.mode||'flag');break;
 case'answer':answerQuestion(Number(target.dataset.index));break;
 case'next-question':nextQuestion();break;
 case'memory-setup':memorySetup();break;
 case'memory-size':state.memorySize=Number(target.dataset.size);memorySetup();break;
 case'memory-variant':state.memoryVariant=v;memorySetup();break;
 case'start-memory':startMemory();break;
 case'flip':flipCard(Number(target.dataset.index));break;
 case'passport-tab':state.passportTab=v;render();break;
 case'balloon':if(Object.hasOwn(PALETTES,v)&&totalKm()>=PALETTES[v].km){progress.settings.balloon=v;save();render();showToast('Dein neuer Ballon ist startklar.');}break;
 case'difficulty':progress.settings.difficulty=v==='explorer'?'explorer':'starter';save();renderSettings();break;
 case'toggle-sound':progress.settings.sound=!progress.settings.sound;save();renderSettings();playTone(true);break;
 case'export':exportProgress();break;
 case'import':$('#importFile').click();break;
 case'reset':if($('#resetConfirm')?.value.trim()!=='NEUSTART'){showToast('Bitte NEUSTART eintippen, um das L\u00f6schen zu best\u00e4tigen.');return;}clearTimeout(memoryTimer);progress=blankProgress();state.game=null;state.lastResult=null;state.view='home';stopSpeech();closeModal(false);save();render();showToast('Eine neue Reise beginnt.');break;
 }
}
document.addEventListener('click',handleAction);
document.addEventListener('input',e=>{if(e.target.id==='atlasSearch'){state.atlasQuery=e.target.value;updateAtlasResults();}});
document.addEventListener('change',e=>{if(e.target.id==='gameRegion')state.gameRegion=e.target.value;});
$('#importFile').addEventListener('change',async e=>{await importProgress(e.target.files[0]);e.target.value='';});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const rect=e.target.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal();}});
let swipeStart=null;
$('#modal').addEventListener('touchstart',e=>{if(state.modal?.kind==='country'&&e.touches.length===1)swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
$('#modal').addEventListener('touchend',e=>{if(!swipeStart||state.modal?.kind!=='country')return;const t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.7)stepCountry(dx<0?1:-1);},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(state.modal){if(state.modal.kind==='country'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();stepCountry(e.key==='ArrowRight'?1:-1);}return;}if(state.view==='quiz'&&state.game){const keys=['1','2','3','4','a','b','c','d'];const key=e.key.toLowerCase(),i=keys.indexOf(key);if(i>=0){e.preventDefault();answerQuestion(i%4);}if(e.key==='Enter'&&state.game.locked){e.preventDefault();nextQuestion();}}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [role="button"]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
window.addEventListener('pagehide',()=>stopSpeech());
window.addEventListener('storage',e=>{if(e.key===KEY){showToast('Lernstand in einem anderen Tab ge\u00e4ndert. Zum Aktualisieren diese Seite neu laden.');}});
render();
if(migrated){save();showToast('Besuchte L\u00e4nder aus V1 als Entdeckungen \u00fcbernommen. Lern-km wurden neu berechnet.');}
if(!storageOK)showToast('Speicherung ist eingeschr\u00e4nkt. Bitte Lernstand unter Einstellungen sichern.');
/* Optional offline install support is enabled only in the complete GitHub package. */
if(document.querySelector('meta[name="geo-offline"]')&&'serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

</script>
</body></html>
